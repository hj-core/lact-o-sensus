syntax = "proto3";

package raft.v1;

// --- Consensus Service (Raft Peer-to-Peer) ---

// The internal consensus service orchestrating the full-mesh replication
// and election protocols (ADR 002). Liveness is driven by deterministic
// heartbeat and election timers (ADR 003).
service ConsensusService {
    // Solicitation of votes during a leadership campaign.
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
    // Replication of log entries and heartbeat synchronization.
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
    // Synchronize the full state machine snapshot to a follower.
    rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// Request to grant a vote for a candidate in the specified term.
message RequestVoteRequest {
    uint64 term = 1;
    string candidate_id = 2;
    uint64 last_log_index = 3;
    uint64 last_log_term = 4;
}

// Response to a RequestVote solicitation.
message RequestVoteResponse {
    uint64 term = 1;
    bool vote_granted = 2;
}

// A single entry in the replicated log.
message LogEntry {
    uint64 term = 1;
    uint64 index = 2;
    bytes data = 3; // Opaque application-level payload (Clean Architecture)
}

// Request to append log entries or synchronize the leader's commit index.
message AppendEntriesRequest {
    uint64 term = 1;
    string leader_id = 2;
    uint64 prev_log_index = 3;
    uint64 prev_log_term = 4;
    repeated LogEntry entries = 5;
    uint64 leader_commit = 6;
}

// Response to an AppendEntries synchronization request.
message AppendEntriesResponse {
    uint64 term = 1;
    bool success = 2;
    uint64 last_log_index = 3; // Optimization for rapid log reconciliation
}

// Request to install a state machine snapshot on a follower.
message InstallSnapshotRequest {
    uint64 term = 1;
    string leader_id = 2;
    uint64 last_included_index = 3;
    uint64 last_included_term = 4;
    bytes data = 5; // The raw snapshot payload (ADR 011)
}

// Response to an InstallSnapshot request.
message InstallSnapshotResponse {
    uint64 term = 1;
}

// Persistent Hard State stored on disk (§5.1).
// Encapsulates the core consensus state that must survive a crash.
message HardState {
    uint64 term = 1;
    string vote = 2; // The identifier of the node voted for in the current term.
}
